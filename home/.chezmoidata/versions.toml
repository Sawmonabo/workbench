# Tool/runtime version pins for install scripts.
# Captured from the Ubuntu 22.04 machine inventory on 2026-08-17, then
# re-captured on 2026-09-06 for node_default, codex and claude: the macOS
# scripts now consume these pins, and the 2026-08-17 values would have
# downgraded Claude Code below the >= 2.1.260 that the managed
# outputStyle = "Concise" needs and made Node 22 the default over the
# current LTS.
# versions_mode=pinned uses these exact versions; latest uses newest in each line.
[versions]
node = ["20.19.5", "22.21.1", "22.23.0", "24.19.0"]
node_default = "24.19.0"
python_minors = ["3.12", "3.13", "3.14"]
python_pinned = ["3.12.12", "3.13.10", "3.14.6"]
go = "1.25.7"
rust = "1.93.0"
bun = "1.3.8"
nvm = "v0.40.2"
uv = "0.11.21"
codex = "0.153.0"
claude = "2.1.263"

# Management acquisition consumes versions.uv and versions.python_pinned[0].
# These compatibility qualifications do not change user runtime version policy.
[management]
chezmoi = "2.70.3"
uv_additional = ["0.12.3"]
python_min_minor = 11
python_max_minor = 14
tomlkit = "0.15.1"
tomlkit_sha256 = "177a05aece5a8ca5266fd3c448abb47b8d352f09d477d3ca8332db4d89b24304"
tomlkit_url = "https://files.pythonhosted.org/packages/13/bc/8c13eb66537dce1d2bd3a57132902f38d0e7f5bb46fa9f4daed9fe9d76ee/tomlkit-0.15.1-py3-none-any.whl"
tomlkit_license = "MIT"
chezmoi_sha256 = { "darwin-amd64" = "b1df8211b594375eed78c6685b7e1019e08a0e4e607f28ff452fbb87f62c2211", "darwin-arm64" = "2de26b4217795c2bcf2c5209739f8f0f4c8d687e9441f99e3ca9b51d2269caab", "linux-amd64" = "ed3a131a7e71798513255d8c05534a14a16d98839820708e839d3403be5b46b2", "linux-arm64" = "f094f9baccbe1e5e9744fc70f74974ba1793f2cba550f8b4a9d0fe5310f4a38f" }
uv_sha256 = { "darwin-amd64" = "f3c8e5708a84b920c18b691214d54d2b0da6b984789caae95d47c95120cb7765", "darwin-arm64" = "1f921d491ba5ffeea774eb04d6681ecee379101341cbb1500394993b541bf3f4", "linux-amd64" = "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050", "linux-arm64" = "88e800834007cc5efd4675f166eb2a51e7e3ad19876d85fa8805a6fb5c922397" }

# GitHub Actions pinned by commit, for the generated project CI job and this
# repository's workflows. generate-source-trust.py refuses any workflow pin that
# differs from these.
[github_actions]
"actions/checkout" = { version = "v7.0.1", commit = "3d3c42e5aac5ba805825da76410c181273ba90b1" }
"actions/setup-go" = { version = "v7.0.0", commit = "b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" }
"astral-sh/setup-uv" = { version = "v10.1.0", commit = "bec219d24cd3e171d82865faccec33120bb574f4" }
"golangci/golangci-lint-action" = { version = "v9.3.0", commit = "ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a" }

[corepack_globals]
pnpm = "10.33.2"
yarn = "1.22.22"

# uv tool install <name>==<version> (sidekick tools are installed manually)
[uv_tools]
"basedpyright" = "1.40.1"
"pyclean" = "3.4.0"
"ruff" = "0.16.8"
"ty" = "0.0.82"

# cargo install <crate> --version <ver>. bat is NOT listed here: the Linux
# bootstrap script installs it from apt (cargo only as a fallback), so listing
# it would compile it a second time on every apply.
[cargo_tools]
"cargo-audit" = "0.22.2"
"cargo-deny" = "0.20.2"
"just" = "1.57.0"

# go install <module>@<version>
[go_tools]
"golang.org/x/tools/gopls" = "v0.23.0"
