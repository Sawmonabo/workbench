# Tool/runtime version pins for install scripts.
# Node, Go, Rust and Python pin the latest patch of each supported line, which
# scripts/check-version-pins.py checks weekly; node_default is the newest LTS
# line's pin, so it moves when a newer line becomes LTS. codex and claude are the versions
# the agent command guard was observed with (docs/acceptance.md): Codex 0.163.0
# is the first to set CODEX_TOOL_CALL_ID, which the guard matches commands by,
# and Claude Code must be >= 2.1.260 for the managed outputStyle = "Concise".
# versions_mode=pinned uses these exact versions; latest uses newest in each line.
# uv installs the pinned Pythons, so it must be a release whose download list
# has every python_pinned version.
[versions]
node = ["22.23.5", "24.22.3", "26.13.1"]
node_default = "26.13.1"
python_minors = ["3.12", "3.13", "3.14", "3.15"]
python_pinned = ["3.12.16", "3.13.18", "3.14.10", "3.15.2"]
go = "1.27.4"
rust = "1.100.0"
bun = "1.3.8"
nvm = "v0.40.2"
uv = "0.13.7"
codex = "0.163.0"
claude = "2.1.301"

# Management acquisition consumes versions.uv and versions.python_pinned[0].
# These compatibility qualifications do not change user runtime version policy.
# Workbench reads this file from the selected source (--local-build, else the active
# release) each time it runs, so a change here takes effect on the next plan.
[management]
chezmoi = "2.70.3"
uv_additional = ["0.13.9"]
python_min_minor = 11
python_max_minor = 14
tomlkit = "0.15.1"
tomlkit_sha256 = "177a05aece5a8ca5266fd3c448abb47b8d352f09d477d3ca8332db4d89b24304"
tomlkit_url = "https://files.pythonhosted.org/packages/13/bc/8c13eb66537dce1d2bd3a57132902f38d0e7f5bb46fa9f4daed9fe9d76ee/tomlkit-0.15.1-py3-none-any.whl"
tomlkit_license = "MIT"
chezmoi_sha256 = { "darwin-amd64" = "b1df8211b594375eed78c6685b7e1019e08a0e4e607f28ff452fbb87f62c2211", "darwin-arm64" = "2de26b4217795c2bcf2c5209739f8f0f4c8d687e9441f99e3ca9b51d2269caab", "linux-amd64" = "ed3a131a7e71798513255d8c05534a14a16d98839820708e839d3403be5b46b2", "linux-arm64" = "f094f9baccbe1e5e9744fc70f74974ba1793f2cba550f8b4a9d0fe5310f4a38f" }
uv_sha256 = { "darwin-amd64" = "20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7", "darwin-arm64" = "81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731", "linux-amd64" = "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83", "linux-arm64" = "71279f8d3c67241e807b9d8db872d1bf541579fb9f08b7d1eb1682196d1e57dc" }

# GitHub Actions pinned by commit, for the generated project CI job and this
# repository's workflows. scripts/check-action-pins.py refuses any workflow pin
# that differs from these.
[github_actions]
"actions/checkout" = { version = "v7.0.1", commit = "3d3c42e5aac5ba805825da76410c181273ba90b1" }
"actions/setup-go" = { version = "v7.0.0", commit = "b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" }
"astral-sh/setup-uv" = { version = "v10.1.0", commit = "bec219d24cd3e171d82865faccec33120bb574f4" }
"dependabot/fetch-metadata" = { version = "v3.1.0", commit = "25dd0e34f4fe68f24cc83900b1fe3fe149efef98" }
"golangci/golangci-lint-action" = { version = "v9.3.0", commit = "ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a" }

[corepack_globals]
pnpm = "10.33.2"
yarn = "1.22.22"

# uv tool install <name>==<version> (sidekick tools are installed manually)
[uv_tools]
"basedpyright" = "1.40.1"
"pyclean" = "3.4.0"
"ruff" = "0.16.8"
"ty" = "0.0.82"

# cargo install <crate> --version <ver>. bat is NOT listed here: the Linux
# bootstrap script installs it from apt (cargo only as a fallback), so listing
# it would compile it a second time on every apply.
[cargo_tools]
"cargo-audit" = "0.22.2"
"cargo-deny" = "0.20.2"
"just" = "1.57.0"

# go install <module>@<version>, on every platform.
[go_tools]
"golang.org/x/tools/gopls" = "v0.23.0"

# go install <module>@<version> on Linux only: the Mac gets these from
# Homebrew (packages.toml), so listing them in go_tools would give it a second
# copy.
[linux_go_tools]
"golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
"mvdan.cc/gofumpt" = "v0.12.0"

# Release binaries the Linux packages step downloads into ~/.local/bin, from
# each project's GitHub releases (the Mac gets them from Homebrew). latest mode
# takes each project's latest release instead.
[linux_binaries]
"gitleaks" = "8.30.1"
"golangci-lint" = "2.15.0"
"lefthook" = "2.2.2"

# SHA-256 of the release archives the generated project CI jobs download,
# keyed by the version pinned above, so a version bump without its checksum
# stops project apply --ci instead of writing a check that fails. From each
# release's own checksums file.
[project_ci]
gitleaks_linux_x64_sha256 = { "8.30.1" = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" }
cargo_deny_linux_x64_sha256 = { "0.20.2" = "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f" }

# mbx (jdx/mr-boxington), the shared Rust build cache the optional mbx step
# installs into ~/.local/bin, in pinned and latest mode alike. sha256 holds the
# release's SHA256SUMS line of each build's archive, keyed by Workbench's
# target; a target without one (an Intel Mac: mbx publishes no
# x86_64-apple-darwin build) is not offered the step. The step writes the
# machine's compile budget into mbx's own config file, each key only when the
# file does not set it yet: scheduler.memory as memory_percent of installed
# memory in whole GiB, rounded down, and scheduler.reserve_cpus.
[mbx]
version = "1.30.0"
sha256 = { "darwin-arm64" = "d5b957216c8b61c2df91c9e7aaf5febd45ec74274a60d3714ebe316edc144543", "linux-amd64" = "f4992b401fe65744b7c6e7400933d2106da205b499405621d088051a31a8f3f2", "linux-arm64" = "6317bb6780404e78c3b670d95e128c85871809dfc541882b2efaa34120f45e71" }
memory_percent = 60
reserve_cpus = 2
