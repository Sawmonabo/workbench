title = "Workbench secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Windows Terminal resize shortcut, not an API credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^ctrl\+shift\+down$''']
paths = ['''^home/\.chezmoiscripts/wsl/run_(once_)?before_00-packages-windows\.sh\.tmpl$''']

[[rules.allowlists]]
description = "Made-up GitLab token the diff-masking safeguard test plants, never a real credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^glpat-abc123def456ghi789$''']
paths = ['''^internal/machine/files_test\.go$''']

[[rules.allowlists]]
description = "Public fingerprint of the Claude Code release signing key, as Anthropic's setup documentation lists it, not a credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^31ddde24ddfab679f42d7bd2baa929ff1a7ecace$''']
paths = ['''^internal/machine/agents\.go$''']
