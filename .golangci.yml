version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - forcetypeassert
    - funlen
    - gocognit
    - lll
    - modernize
    - nestif
    - revive
    - unparam
  settings:
    # Hard guards; golines wraps ordinary code at 100 first.
    lll:
      line-length: 120
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 40
    nestif:
      min-complexity: 8
    revive:
      rules:
        - name: exported
        - name: package-comments
formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 100
