version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gocognit
    - lll
    - modernize
    - nestif
    - revive
    - unparam
  settings:
    # A default case counts: switches may handle a few kinds and send the rest
    # to one branch.
    exhaustive:
      default-signifies-exhaustive: true
    # Hard guards; golines wraps ordinary code at 100 first.
    lll:
      line-length: 120
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 40
    nestif:
      min-complexity: 8
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      # Keep long user-facing strings whole; Go style says not to split them.
      - linters: [lll]
        source: '"[^"]{50,}"'
      # Safeguard tests read as one scenario; see AGENTS.md's test rule.
      - linters: [funlen]
        path: _test\.go
formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 100
