name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  # A tag publishes only a commit that passes every CI check, secret scan included.
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes read every commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # CGO_ENABLED=0 cross-compiles every target from one runner. Each release
      # carries its own install.sh stamped with its tag, so releases/latest
      # installs exactly that release and an old install.sh installs its own.
      - name: Build bundles and installer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            python3 scripts/package-release.py --version "$VERSION" --target "$target" --output dist
          done
          sed "s/^default_version=.*/default_version=$VERSION/" install.sh > dist/install.sh
          grep -q "^default_version=$VERSION\$" dist/install.sh
      # The release notes are this tag's section of CHANGELOG.md (cliff.toml).
      - name: Write release notes
        run: scripts/git-cliff.sh --config cliff.toml --latest --strip header -o "$RUNNER_TEMP/release-notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag
          --notes-file "$RUNNER_TEMP/release-notes.md" dist/*.tar.gz dist/install.sh
  # Once the release is published, commit the changelog through this tag to
  # main. A push with the workflow token starts no other workflow.
  changelog:
    needs: release
    # One changelog commit at a time. GitHub replaces a pending run in this
    # group with a newer one, which is fine here: the newest tag writes the
    # whole history. Releases themselves are never queued or cancelled.
    concurrency:
      group: changelog
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Generated at the tag, so commits after it on main stay out.
      - name: Generate the changelog
        run: scripts/git-cliff.sh --config cliff.toml -o "$RUNNER_TEMP/CHANGELOG.md"
      - name: Commit it to main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git checkout -B main origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD || { echo "$VERSION is not on main; CHANGELOG.md left alone"; exit 0; }
          # A newer tag's run writes the changelog; an older one must not overwrite it.
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          [ "$newest" = "$VERSION" ] || { echo "$newest is newer than $VERSION; its run writes CHANGELOG.md"; exit 0; }
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already covers $VERSION"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(changelog): $VERSION"
          git push origin main
