name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Tag runs queue in push order, so a later changelog commit never races an earlier one.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # A tag publishes only a commit that passes every CI check, secret scan included.
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes read every commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # CGO_ENABLED=0 cross-compiles every target from one runner. Each release
      # carries its own install.sh stamped with its tag, so releases/latest
      # installs exactly that release and an old install.sh installs its own.
      - name: Build bundles and installer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            python3 scripts/package-release.py --version "$VERSION" --target "$target" --output dist
          done
          sed "s/^default_version=.*/default_version=$VERSION/" install.sh > dist/install.sh
          grep -q "^default_version=$VERSION\$" dist/install.sh
      # The release notes are this tag's section of CHANGELOG.md (cliff.toml).
      - name: Write release notes
        shell: bash
        run: |
          cliff_dir=$(mktemp -d "$RUNNER_TEMP/git-cliff.XXXXXX")
          curl -fsSL --retry 3 https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz -o "$cliff_dir/git-cliff.tar.gz"
          # Pinned from the official v2.14.2 asset; it matches upstream's .sha512 file.
          printf '%s  %s\n' '24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4' "$cliff_dir/git-cliff.tar.gz" | sha256sum --check --strict
          tar -xzf "$cliff_dir/git-cliff.tar.gz" -C "$cliff_dir" git-cliff-2.14.2/git-cliff
          "$cliff_dir/git-cliff-2.14.2/git-cliff" --config cliff.toml --latest --strip header -o "$RUNNER_TEMP/release-notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag
          --notes-file "$RUNNER_TEMP/release-notes.md" dist/*.tar.gz dist/install.sh
  # Once the release is published, commit the changelog through this tag to
  # main. A push with the workflow token starts no other workflow.
  changelog:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Generated at the tag, so commits after it on main stay out.
      - name: Generate the changelog
        shell: bash
        run: |
          cliff_dir=$(mktemp -d "$RUNNER_TEMP/git-cliff.XXXXXX")
          curl -fsSL --retry 3 https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz -o "$cliff_dir/git-cliff.tar.gz"
          # Pinned from the official v2.14.2 asset; it matches upstream's .sha512 file.
          printf '%s  %s\n' '24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4' "$cliff_dir/git-cliff.tar.gz" | sha256sum --check --strict
          tar -xzf "$cliff_dir/git-cliff.tar.gz" -C "$cliff_dir" git-cliff-2.14.2/git-cliff
          "$cliff_dir/git-cliff-2.14.2/git-cliff" --config cliff.toml -o "$RUNNER_TEMP/CHANGELOG.md"
      - name: Commit it to main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git checkout -B main origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD || { echo "$VERSION is not on main; CHANGELOG.md left alone"; exit 0; }
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already covers $VERSION"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(changelog): $VERSION"
          git push origin main
