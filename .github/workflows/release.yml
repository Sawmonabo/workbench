name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  # A tag publishes only a commit that passes every CI check, secret scan included.
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes read every commit and tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # CGO_ENABLED=0 cross-compiles every target from one runner. --published
      # marks these executables as on the release channel. Each release
      # carries its own install.sh stamped with its tag, so releases/latest
      # installs exactly that release and an old install.sh installs its own.
      - name: Build bundles and installer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for target in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            python3 scripts/package-release.py --version "$VERSION" --target "$target" --output dist --published
          done
          sed "s/^default_version=.*/default_version=$VERSION/" install.sh > dist/install.sh
          grep -q "^default_version=$VERSION\$" dist/install.sh
      # The notes cover this tag's commits since the tag before it, named
      # explicitly so a later tag never changes them. A full release's notes
      # are its section of CHANGELOG.md (cliff.toml) and start after the
      # previous full release. A pre-release (a tag with a hyphen,
      # vX.Y.Z-rc.N) has no section there: its notes start after any earlier
      # v* tag, with the tag pattern widened to count it. Without an earlier
      # tag the notes cover the whole history up to the tag.
      - name: Write release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -- --config cliff.toml --strip header -o "$RUNNER_TEMP/release-notes.md"
          case $VERSION in
          *-*)
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$VERSION^" 2>/dev/null || true)
            set -- "$@" --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'
            ;;
          *) previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$VERSION^" 2>/dev/null || true) ;;
          esac
          scripts/git-cliff.sh "$@" ${previous:+"$previous..$VERSION"}
      # A pre-release is published as one, so GitHub's latest release, which
      # update and install.sh follow, stays the newest full release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          prerelease=false
          case $VERSION in *-*) prerelease=true ;; esac
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease="$prerelease" \
            --notes-file "$RUNNER_TEMP/release-notes.md" dist/*.tar.gz dist/install.sh
  # Once a full release is published, commit the changelog through this tag
  # to main. A pre-release gets no section and no commit. A push with the
  # workflow token starts no other workflow.
  changelog:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    # One changelog commit at a time. GitHub replaces a pending run in this
    # group with a newer one, which is fine here: the newest tag writes the
    # whole history. Releases themselves are never queued or cancelled.
    concurrency:
      group: changelog
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Generated at the tag, so commits after it on main stay out.
      - name: Generate the changelog
        run: scripts/git-cliff.sh --config cliff.toml -o "$RUNNER_TEMP/CHANGELOG.md"
      - name: Commit it to main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git checkout -B main origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD || { echo "$VERSION is not on main; CHANGELOG.md left alone"; exit 0; }
          # A newer tag's run writes the changelog; an older one must not overwrite
          # it. Pre-release tags are left out: git sorts v0.2.0-rc.1 after v0.2.0.
          newest=$(git tag -l 'v*' --sort=-v:refname | grep -v -- - | head -n 1)
          [ "$newest" = "$VERSION" ] || { echo "$newest is newer than $VERSION; its run writes CHANGELOG.md"; exit 0; }
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already covers $VERSION"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(changelog): $VERSION"
          git push origin main
