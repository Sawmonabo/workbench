name: Private release bundle verification
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable review bundle identifier (does not publish a release)
        required: true
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        target: [darwin-arm64, darwin-amd64, linux-arm64, linux-amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate and package private artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/package-release.py --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-${{ matrix.target }}
          path: dist/
          retention-days: 7
      # Deliberately no release publication, write permission, signing identity
      # or repository visibility change. Native acceptance remains separate.
